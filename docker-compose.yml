version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: placementprep-postgres
    environment:
      POSTGRES_USER: placementprep
      POSTGRES_PASSWORD: placementprep123
      POSTGRES_DB: placementprep
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: placementprep-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
